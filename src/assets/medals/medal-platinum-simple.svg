<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" role="img" aria-labelledby="lc-mps-title">
  <title id="lc-mps-title">Platinum medal</title>
  <defs>
    <linearGradient id="lc-mps-rim" gradientUnits="userSpaceOnUse" x1="1" y1="1" x2="19" y2="19">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="lc-mps-well" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="16" y2="16">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#7927EC"/>
    </linearGradient>
  </defs>
  <!-- Full-width 18.2px faceted diamond -->
  <polygon points="10,0.9 19.1,10 10,19.1 0.9,10" fill="url(#lc-mps-rim)" stroke="#2E1065" stroke-width="1.4" stroke-linejoin="bevel"/>
  <polygon points="10,0.9 0.9,10 4.5,10 10,4.5" fill="#FFFFFF" fill-opacity="0.9"/>
  <polygon points="10,4.5 15.5,10 10,15.5 4.5,10" fill="url(#lc-mps-well)" stroke="#2E1065" stroke-width="0.85" stroke-linejoin="bevel"/>
  <!-- 4-point prism star -->
  <polygon points="10,5.6 11.3,8.7 14.4,10 11.3,11.3 10,14.4 8.7,11.3 5.6,10 8.7,8.7" fill="#FFFFFF"/>
</svg>
