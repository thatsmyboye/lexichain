<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="lc-mgd-title">
  <title id="lc-mgd-title">Gold medal</title>
  <defs>
    <linearGradient id="lc-mgd-outer" gradientUnits="userSpaceOnUse" x1="6" y1="6" x2="74" y2="74">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="42%" stop-color="#FACC15"/>
      <stop offset="78%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="lc-mgd-ring" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="64" y2="64">
      <stop offset="0%" stop-color="#A16207"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="lc-mgd-well" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="60" y2="60">
      <stop offset="0%" stop-color="#5C2D05"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>

  <!-- 8-point faceted starburst -->
  <polygon points="40,4 49.6,16.8 65.5,14.5 63.2,30.4 76,40 63.2,49.6 65.5,65.5 49.6,63.2 40,76 30.4,63.2 14.5,65.5 16.8,49.6 4,40 16.8,30.4 14.5,14.5 30.4,16.8" fill="url(#lc-mgd-outer)" stroke="#542C04" stroke-width="2.4" stroke-linejoin="bevel"/>

  <!-- Radial starburst facet ridges -->
  <g stroke="#542C04" stroke-width="1" stroke-opacity="0.4">
    <line x1="40" y1="4" x2="40" y2="17"/>
    <line x1="65.5" y1="14.5" x2="56.3" y2="23.7"/>
    <line x1="76" y1="40" x2="63" y2="40"/>
    <line x1="65.5" y1="65.5" x2="56.3" y2="56.3"/>
    <line x1="40" y1="76" x2="40" y2="63"/>
    <line x1="14.5" y1="65.5" x2="23.7" y2="56.3"/>
    <line x1="4" y1="40" x2="17" y2="40"/>
    <line x1="14.5" y1="14.5" x2="23.7" y2="23.7"/>
  </g>
  <!-- Top-left sunburst glint -->
  <polygon points="40,5.5 31.2,17.8 40,17.8" fill="#FFFFFF" fill-opacity="0.55"/>
  <polygon points="15.8,15.8 18.0,30.0 24.5,24.5" fill="#FFFFFF" fill-opacity="0.55"/>

  <!-- Stepped gold collar & recessed core -->
  <circle cx="40" cy="40" r="23.5" fill="url(#lc-mgd-ring)" stroke="#542C04" stroke-width="1.6"/>
  <circle cx="40" cy="40" r="19" fill="url(#lc-mgd-well)" stroke="#451A03" stroke-width="1.5"/>

  <!-- Faceted 5-point relief star -->
  <g stroke="#542C04" stroke-width="1.1" stroke-linejoin="bevel">
    <polygon points="40,23 44.1,34.4 40,40" fill="#FDE047"/>
    <polygon points="40,23 40,40 35.9,34.4" fill="#FEF9C3"/>
    <polygon points="56.2,34.7 46.6,42.1 40,40" fill="#CA8A04"/>
    <polygon points="56.2,34.7 40,40 44.1,34.4" fill="#FEF08A"/>
    <polygon points="50.0,53.8 40,46.9 40,40" fill="#A16207"/>
    <polygon points="50.0,53.8 40,40 46.6,42.1" fill="#EAB308"/>
    <polygon points="30.0,53.8 33.4,42.1 40,40" fill="#EAB308"/>
    <polygon points="30.0,53.8 40,40 40,46.9" fill="#CA8A04"/>
    <polygon points="23.8,34.7 35.9,34.4 40,40" fill="#FEF9C3"/>
    <polygon points="23.8,34.7 40,40 33.4,42.1" fill="#FACC15"/>
  </g>
</svg>
