<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="lc-msd-title">
  <title id="lc-msd-title">Silver medal</title>
  <defs>
    <linearGradient id="lc-msd-outer" gradientUnits="userSpaceOnUse" x1="5" y1="6" x2="75" y2="75">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="lc-msd-bevel" gradientUnits="userSpaceOnUse" x1="11" y1="12" x2="69" y2="67">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="lc-msd-well" gradientUnits="userSpaceOnUse" x1="16" y1="17" x2="64" y2="60.5">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Geometric faceted shield (70x69, matching Bronze/Gold/Platinum weight) -->
  <polygon points="14,6 66,6 75,15 75,44.5 40,75 5,44.5 5,15" fill="url(#lc-msd-outer)" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="bevel"/>
  <!-- 120° top-left specular bevel -->
  <polyline points="7.5,43.5 7.5,16 15,8.5 65,8.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="bevel"/>
  <!-- Inner stepped collar -->
  <polygon points="17.5,12 62.5,12 69,18.5 69,42 40,67 11,42 11,18.5" fill="url(#lc-msd-bevel)" stroke="#334155" stroke-width="1.4" stroke-linejoin="bevel"/>
  <!-- Recessed steel well (edge at x=28 is y=50.0) -->
  <polygon points="20.5,17 59.5,17 64,21.5 64,39.5 40,60.5 16,39.5 16,21.5" fill="url(#lc-msd-well)" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="bevel"/>

  <!-- Twin beveled chevrons (x=28..52, lowest corner y=45.5, fully inside well) -->
  <g stroke="#0F172A" stroke-width="1.2" stroke-linejoin="bevel">
    <polygon points="40,20.5 40,27 28,35 28,28.5" fill="#FFFFFF"/>
    <polygon points="40,20.5 52,28.5 52,35 40,27" fill="#CBD5E1"/>
    <polygon points="40,31 40,37.5 28,45.5 28,39" fill="#E2E8F0"/>
    <polygon points="40,31 52,39 52,45.5 40,37.5" fill="#94A3B8"/>
  </g>
</svg>
