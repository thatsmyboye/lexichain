<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="lc-mu-title">
  <title id="lc-mu-title">Unearned medal</title>
  <!-- Subtle recessed socket fill -->
  <circle cx="40" cy="40" r="33.5" fill="#94A3B8" fill-opacity="0.16"/>
  <!-- Dashed coin slot border -->
  <circle cx="40" cy="40" r="33.5" fill="none" stroke="#64748B" stroke-width="3.2" stroke-dasharray="10 6.19" stroke-linecap="butt"/>
  <!-- Inner recessed lip -->
  <circle cx="40" cy="40" r="24" fill="none" stroke="#64748B" stroke-width="1.8" stroke-opacity="0.5"/>
  <!-- Bottom-right recessed catch -->
  <path d="M57 23 A24 24 0 0 1 23 57" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-opacity="0.38"/>
  <!-- Waiting chamfered diamond outline -->
  <polygon points="40,28 50,40 40,52 30,40" fill="none" stroke="#64748B" stroke-width="2.4" stroke-opacity="0.55" stroke-linejoin="bevel"/>
</svg>
