<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="lc-sp-sns-title">
  <title id="lc-sp-sns-title">Safety Net</title>
  <defs>
    <linearGradient id="lc-sp-sns-post" gradientUnits="userSpaceOnUse" x1="3" y1="9" x2="3" y2="21">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="bevel">
    <!-- Bouncing combo spark caught above the center of the net -->
    <polygon points="12,2.8 13.3,5.2 15.7,6.5 13.3,7.8 12,10.2 10.7,7.8 8.3,6.5 10.7,5.2" fill="#FEF08A" stroke="#451A03" stroke-width="1.4"/>
    <polygon points="12,4.8 13.7,6.5 12,8.2 10.3,6.5" fill="#FFFFFF"/>

    <!-- Open-mesh suspended safety net (transparent holes + clear air underneath; zero basket fill) -->
    <g fill="none" stroke-linecap="square">
      <!-- Dark contrast under-strokes so golden rope reads on light cards -->
      <polyline points="5,11 12,12 19,11" stroke="#451A03" stroke-width="3.2"/>
      <polyline points="5,16.5 12,17.5 19,16.5" stroke="#451A03" stroke-width="3.2"/>
      <line x1="6.2" y1="11.4" x2="11.5" y2="17" stroke="#451A03" stroke-width="2.8"/>
      <line x1="12.5" y1="11.8" x2="17.8" y2="16.8" stroke="#451A03" stroke-width="2.8"/>
      <line x1="11.5" y1="11.8" x2="6.2" y2="16.8" stroke="#451A03" stroke-width="2.8"/>
      <line x1="17.8" y1="11.4" x2="12.5" y2="17" stroke="#451A03" stroke-width="2.8"/>

      <!-- Bright golden rope over-strokes -->
      <polyline points="5,11 12,12 19,11" stroke="#FEF08A" stroke-width="1.6"/>
      <polyline points="5,16.5 12,17.5 19,16.5" stroke="#FACC15" stroke-width="1.6"/>
      <line x1="6.2" y1="11.4" x2="11.5" y2="17" stroke="#FACC15" stroke-width="1.3"/>
      <line x1="12.5" y1="11.8" x2="17.8" y2="16.8" stroke="#FACC15" stroke-width="1.3"/>
      <line x1="11.5" y1="11.8" x2="6.2" y2="16.8" stroke="#FACC15" stroke-width="1.3"/>
      <line x1="17.8" y1="11.4" x2="12.5" y2="17" stroke="#FACC15" stroke-width="1.3"/>
    </g>

    <!-- Twin vertical steel stanchions anchoring the net with open space beneath -->
    <rect x="2.8" y="8.8" width="2.6" height="12.2" fill="url(#lc-sp-sns-post)" stroke="#0F172A" stroke-width="1.4"/>
    <rect x="18.6" y="8.8" width="2.6" height="12.2" fill="url(#lc-sp-sns-post)" stroke="#0F172A" stroke-width="1.4"/>
  </g>
</svg>
