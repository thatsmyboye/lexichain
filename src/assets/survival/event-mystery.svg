<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="lc-se-my-title">
  <title id="lc-se-my-title">Mystery Box</title>
  <defs>
    <linearGradient id="lc-se-my-lid" gradientUnits="userSpaceOnUse" x1="8" y1="12" x2="56" y2="33">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="52%" stop-color="#7927EC"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="lc-se-my-left" gradientUnits="userSpaceOnUse" x1="10" y1="26" x2="32" y2="57">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="lc-se-my-right" gradientUnits="userSpaceOnUse" x1="32" y1="26" x2="54" y2="57">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E0542"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="bevel">
    <!-- Floating mystery aura sparkle above the box -->
    <polygon points="32,5 34.4,10.6 40,13 34.4,15.4 32,21 29.6,15.4 24,13 29.6,10.6" fill="#FEF08A" stroke="#2E1065" stroke-width="1.8"/>

    <!-- Isometric chest body -->
    <polygon points="10,27 32,38 32,57 10,46" fill="url(#lc-se-my-left)"/>
    <polygon points="54,27 32,38 32,57 54,46" fill="url(#lc-se-my-right)"/>

    <!-- Golden ribbon straps down both walls -->
    <polygon points="18,31 24,34 24,53 18,50" fill="#FACC15" stroke="#2E1065" stroke-width="1.6"/>
    <polygon points="40,34 46,31 46,50 40,53" fill="#D97706" stroke="#2E1065" stroke-width="1.6"/>

    <!-- Luminous mystery glow leaking under the slightly lifted lid -->
    <polygon points="10,25 32,36 54,25 32,31" fill="#FEF08A"/>

    <!-- Isometric chamfered lid -->
    <polygon points="32,14 56,25 32,35 8,25" fill="url(#lc-se-my-lid)"/>
    <polygon points="28,16 36,16 47,29 39,32" fill="#FACC15" fill-opacity="0.85"/>
    <polygon points="17,29 25,32 36,16 28,16" fill="#FEF08A" fill-opacity="0.9"/>

    <!-- Clean dark contours on top -->
    <polygon points="10,27 32,38 54,27 54,46 32,57 10,46" fill="none" stroke="#14072B" stroke-width="2.6"/>
    <line x1="32" y1="38" x2="32" y2="57" stroke="#14072B" stroke-width="2.2"/>
    <polygon points="32,14 56,25 32,35 8,25" fill="none" stroke="#14072B" stroke-width="2.6"/>

    <!-- Golden front lock diamond -->
    <polygon points="32,33 37,38 32,43 27,38" fill="#FEF08A" stroke="#14072B" stroke-width="2"/>
  </g>
</svg>
