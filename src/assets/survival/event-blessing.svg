<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="lc-se-bl-title">
  <title id="lc-se-bl-title">Blessing</title>
  <defs>
    <linearGradient id="lc-se-bl-gold" gradientUnits="userSpaceOnUse" x1="6" y1="8" x2="58" y2="56">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="lc-se-bl-wing" gradientUnits="userSpaceOnUse" x1="6" y1="22" x2="58" y2="50">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="bevel">
    <!-- Twin ascending stylized wings (clearly distinct from pink Perfect Wave boss) -->
    <polygon points="6,23 20,28 24,42 13,44 8,33" fill="url(#lc-se-bl-wing)" stroke="#78350F" stroke-width="2.3"/>
    <polygon points="58,23 44,28 40,42 51,44 56,33" fill="url(#lc-se-bl-wing)" stroke="#78350F" stroke-width="2.3"/>
    <polygon points="10,45 23,44 26,53 16,54" fill="#FDE047" stroke="#78350F" stroke-width="2.1"/>
    <polygon points="54,45 41,44 38,53 48,54" fill="#FDE047" stroke="#78350F" stroke-width="2.1"/>

    <!-- Radiant golden sunburst star -->
    <polygon points="32,7 38,24 52,32 38,40 32,57 26,40 12,32 26,24" fill="url(#lc-se-bl-gold)"/>
    <polygon points="32,7 38,24 52,32 38,40 32,57 32,32" fill="#D97706" fill-opacity="0.24"/>
    <polygon points="32,7 38,24 52,32 38,40 32,57 26,40 12,32 26,24" fill="none" stroke="#78350F" stroke-width="2.5"/>
    <polygon points="32,23 41,32 32,41 23,32" fill="#FFFFFF" stroke="#78350F" stroke-width="1.8"/>
  </g>
</svg>
