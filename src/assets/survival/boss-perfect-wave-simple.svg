<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="lc-sb-pws-title">
  <title id="lc-sb-pws-title">Perfect Wave Boss</title>
  <defs>
    <linearGradient id="lc-sb-pws-g" gradientUnits="userSpaceOnUse" x1="3.5" y1="3.5" x2="20.5" y2="20.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="bevel">
    <!-- Precision diamond halo frame (distinguishes Perfect Wave from golden Blessing) -->
    <polygon points="12,3.2 20.8,12 12,20.8 3.2,12" fill="#500724" fill-opacity="0.22" stroke="#500724" stroke-width="2.6"/>
    <polygon points="12,3.2 20.8,12 12,20.8 3.2,12" fill="none" stroke="#F472B6" stroke-width="1.3"/>
    <!-- Flawless 4-point rose-prism star -->
    <polygon points="12,3.5 14.5,9.5 20.5,12 14.5,14.5 12,20.5 9.5,14.5 3.5,12 9.5,9.5" fill="url(#lc-sb-pws-g)" stroke="#500724" stroke-width="1.6"/>
    <polygon points="12,8.8 15.2,12 12,15.2 8.8,12" fill="#FFFFFF"/>
  </g>
</svg>
