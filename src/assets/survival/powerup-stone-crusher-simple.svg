<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="lc-sp-scs-title">
  <title id="lc-sp-scs-title">Stone Crusher</title>
  <defs>
    <linearGradient id="lc-sp-scs-head" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="15" y2="15">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="45%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="lc-sp-scs-hdl" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="21" y2="21">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="bevel">
    <!-- Warm amber handle running cleanly to bottom-right -->
    <polygon points="10.2,13.1 13.1,10.2 20.9,18 18,20.9" fill="url(#lc-sp-scs-hdl)"/>
    <line x1="12.2" y1="12.2" x2="19.2" y2="19.2" stroke="#FDE68A" stroke-width="1.2" stroke-opacity="0.72"/>
    <polygon points="10.2,13.1 13.1,10.2 20.9,18 18,20.9" fill="none" stroke="#0F172A" stroke-width="1.7"/>

    <!-- Gold collar ring separating handle from steel head -->
    <polygon points="9.6,12.5 12.5,9.6 14.3,11.4 11.4,14.3" fill="#FACC15" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Bold chamfered steel sledgehammer head (bounds strictly inside [2.1, 21.9]) -->
    <polygon points="2.95,10.3 10.3,2.95 12.28,2.95 14.83,7.47 7.47,14.83 2.95,12.28" fill="url(#lc-sp-scs-head)"/>
    <!-- Shaded lower-right strike face -->
    <polygon points="5.2,13.6 13.6,5.2 14.83,7.47 7.47,14.83" fill="#1E293B" fill-opacity="0.45"/>
    <!-- Bright top-left bevel catch (pops on dark cards without turning into a white bar) -->
    <line x1="4.4" y1="10.4" x2="10.4" y2="4.4" stroke="#F8FAFC" stroke-width="1.5" stroke-opacity="0.9"/>
    <!-- Clean outer contour drawn last -->
    <polygon points="2.95,10.3 10.3,2.95 12.28,2.95 14.83,7.47 7.47,14.83 2.95,12.28" fill="none" stroke="#0F172A" stroke-width="1.7"/>
  </g>
</svg>
