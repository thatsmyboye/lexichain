<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="lc-sb-pts-title">
  <title id="lc-sb-pts-title">Point Threshold Boss</title>
  <defs>
    <linearGradient id="lc-sb-pts-g" gradientUnits="userSpaceOnUse" x1="3" y1="4" x2="21" y2="20.5">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Wide classic brilliant-cut sapphire (clearly distinct from narrow vertical Life Fragment) -->
  <g stroke-linejoin="bevel">
    <polygon points="7.2,4.2 16.8,4.2 20.8,9.8 12,20.4 3.2,9.8" fill="url(#lc-sb-pts-g)"/>
    <polygon points="7.2,4.2 16.8,4.2 14.8,9.8 9.2,9.8" fill="#FFFFFF" fill-opacity="0.6"/>
    <polygon points="16.8,4.2 20.8,9.8 12,20.4 14.8,9.8" fill="#1E3A8A" fill-opacity="0.34"/>
    <g fill="none" stroke="#082F49" stroke-width="1.3">
      <line x1="3.2" y1="9.8" x2="20.8" y2="9.8"/>
      <polyline points="7.2,4.2 9.2,9.8 12,20.4"/>
      <polyline points="16.8,4.2 14.8,9.8 12,20.4"/>
    </g>
    <polygon points="7.2,4.2 16.8,4.2 20.8,9.8 12,20.4 3.2,9.8" fill="none" stroke="#082F49" stroke-width="1.8"/>
  </g>
</svg>
