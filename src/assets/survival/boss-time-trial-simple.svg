<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="lc-sb-tts-title">
  <title id="lc-sb-tts-title">Time Trial Boss</title>
  <defs>
    <linearGradient id="lc-sb-tts-rim" gradientUnits="userSpaceOnUse" x1="4" y1="5" x2="20" y2="21">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="50%" stop-color="#914DEF"/>
      <stop offset="100%" stop-color="#5B12C6"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="bevel">
    <!-- Stopwatch top crown button -->
    <rect x="9.6" y="2.8" width="4.8" height="2.6" fill="#C4B5FD" stroke="#2E1065" stroke-width="1.5"/>
    <!-- Octagonal chronometer bezel -->
    <polygon points="8.6,5.2 15.4,5.2 19.8,9.6 19.8,16.4 15.4,20.8 8.6,20.8 4.2,16.4 4.2,9.6" fill="url(#lc-sb-tts-rim)"/>
    <polygon points="9.6,7.6 14.4,7.6 17.4,10.6 17.4,15.4 14.4,18.4 9.6,18.4 6.6,15.4 6.6,10.6" fill="#1E1B4B"/>
    <polygon points="8.6,5.2 15.4,5.2 19.8,9.6 19.8,16.4 15.4,20.8 8.6,20.8 4.2,16.4 4.2,9.6" fill="none" stroke="#2E1065" stroke-width="1.7"/>
    <!-- Blazing lightning bolt slashing across the dial -->
    <polygon points="13.8,6.6 7.4,13.6 11.4,13.6 10.2,19.4 16.6,12.4 12.6,12.4" fill="#FEF08A" stroke="#2E1065" stroke-width="1.4"/>
  </g>
</svg>
