<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="lc-se-gb-title">
  <title id="lc-se-gb-title">Gambit</title>
  <defs>
    <linearGradient id="lc-se-gb-cab" gradientUnits="userSpaceOnUse" x1="7" y1="11" x2="49" y2="56">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="42%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="lc-se-gb-gold" gradientUnits="userSpaceOnUse" x1="12" y1="8" x2="44" y2="19">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="bevel">
    <!-- Side pull-lever & crimson knob -->
    <polyline points="48,37 55,37 55,21" fill="none" stroke="#450A0A" stroke-width="5.6"/>
    <polyline points="48,37 55,37 55,21" fill="none" stroke="#CBD5E1" stroke-width="2.6"/>
    <polygon points="55,12 60,17 55,22 50,17" fill="#F43F5E" stroke="#450A0A" stroke-width="2.2"/>

    <!-- Top gold marquee crown -->
    <polygon points="14,10 42,10 47,18 9,18" fill="url(#lc-se-gb-gold)" stroke="#450A0A" stroke-width="2.4"/>

    <!-- Faceted crimson chance cabinet -->
    <polygon points="8,18 48,18 50,53 46,57 10,57 6,53" fill="url(#lc-se-gb-cab)"/>
    <polygon points="28,18 48,18 50,53 46,57 28,57" fill="#450A0A" fill-opacity="0.24"/>
    <polygon points="8,18 48,18 50,53 46,57 10,57 6,53" fill="none" stroke="#450A0A" stroke-width="2.6"/>

    <!-- 3 bright white reel windows with jeweled icons (no <text>) -->
    <g stroke="#450A0A" stroke-width="1.8">
      <rect x="11" y="24" width="10" height="17" fill="#FFFFFF"/>
      <rect x="23" y="24" width="10" height="17" fill="#FFFFFF"/>
      <rect x="35" y="24" width="10" height="17" fill="#FFFFFF"/>
    </g>
    <!-- Reel pips: gold star, purple diamond, crimson diamond -->
    <polygon points="16,28 19.2,32.5 16,37 12.8,32.5" fill="#F59E0B"/>
    <polygon points="28,28 31.2,32.5 28,37 24.8,32.5" fill="#7927EC"/>
    <polygon points="40,28 43.2,32.5 40,37 36.8,32.5" fill="#DC2626"/>

    <!-- Golden payout tray -->
    <rect x="13" y="46" width="30" height="6" fill="#FACC15" stroke="#450A0A" stroke-width="2"/>
  </g>
</svg>
