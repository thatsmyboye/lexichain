<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="lc-se-cu-title">
  <title id="lc-se-cu-title">Curse</title>
  <defs>
    <linearGradient id="lc-se-cu-bone" gradientUnits="userSpaceOnUse" x1="12" y1="7" x2="52" y2="57">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="52%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="bevel">
    <!-- Faceted geometric skull -->
    <polygon points="22,7 42,7 53,18 53,36 44,44 43,56 21,56 20,44 11,36 11,18" fill="url(#lc-se-cu-bone)"/>
    <polygon points="32,7 42,7 53,18 53,36 44,44 43,56 32,56" fill="#334155" fill-opacity="0.28"/>
    <polyline points="15,34 15,20 24,11 40,11" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.9"/>

    <!-- Forehead curse crack -->
    <polyline points="38,8 34,16 39,20 35,25" fill="none" stroke="#2E1065" stroke-width="2.2"/>

    <!-- Deep eye sockets with eerie violet curse sparks -->
    <polygon points="17,25 28,25 27,36 18,36" fill="#1E0542"/>
    <polygon points="36,25 47,25 46,36 37,36" fill="#1E0542"/>
    <polygon points="22.5,27.5 25.5,30.5 22.5,33.5 19.5,30.5" fill="#C084FC"/>
    <polygon points="41.5,27.5 44.5,30.5 41.5,33.5 38.5,30.5" fill="#C084FC"/>

    <!-- Nasal cavity & teeth -->
    <polygon points="32,37 36,43 28,43" fill="#1E0542"/>
    <g stroke="#1E0542" stroke-width="2.2">
      <line x1="27" y1="48" x2="27" y2="56"/>
      <line x1="32" y1="48" x2="32" y2="56"/>
      <line x1="37" y1="48" x2="37" y2="56"/>
    </g>

    <!-- Clean contour on top -->
    <polygon points="22,7 42,7 53,18 53,36 44,44 43,56 21,56 20,44 11,36 11,18" fill="none" stroke="#1E0542" stroke-width="2.6"/>
  </g>
</svg>
