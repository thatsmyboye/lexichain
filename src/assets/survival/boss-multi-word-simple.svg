<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="lc-sb-mws-title">
  <title id="lc-sb-mws-title">Multi-Word Boss</title>
  <defs>
    <linearGradient id="lc-sb-mws-st" gradientUnits="userSpaceOnUse" x1="3.5" y1="3.5" x2="20.5" y2="16.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="bevel">
    <!-- Sword 1 (top-left to bottom-right) -->
    <polygon points="3.8,3.8 7.4,4.4 16.2,13.2 13.2,16.2 4.4,7.4" fill="url(#lc-sb-mws-st)" stroke="#450A0A" stroke-width="1.6"/>
    <polygon points="12,17.2 17.2,12 18.8,13.6 13.6,18.8" fill="#FACC15" stroke="#450A0A" stroke-width="1.4"/>
    <polygon points="15.4,17 17,15.4 20.6,19 19,20.6" fill="#DC2626" stroke="#450A0A" stroke-width="1.5"/>

    <!-- Sword 2 (top-right to bottom-left, layered cleanly over center) -->
    <polygon points="20.2,3.8 19.6,7.4 10.8,16.2 7.8,13.2 16.6,4.4" fill="url(#lc-sb-mws-st)" stroke="#450A0A" stroke-width="1.6"/>
    <polygon points="12,17.2 6.8,12 5.2,13.6 10.4,18.8" fill="#FACC15" stroke="#450A0A" stroke-width="1.4"/>
    <polygon points="8.6,17 7,15.4 3.4,19 5,20.6" fill="#DC2626" stroke="#450A0A" stroke-width="1.5"/>
  </g>
</svg>
