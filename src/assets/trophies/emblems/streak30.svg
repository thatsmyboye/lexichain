<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="lc-tls-title">
  <title id="lc-tls-title">Legendary Streaker trophy</title>
  <defs>
    <linearGradient id="lc-tls-outer" gradientUnits="userSpaceOnUse" x1="89" y1="67" x2="167" y2="187">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="lc-tls-inner" gradientUnits="userSpaceOnUse" x1="112" y1="114" x2="144" y2="174">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>

  <!-- Staggered rising ember sparks (asymmetric so silhouette reads as fire, not crown prongs) -->
  <g stroke="#2A1604" stroke-width="2" stroke-linejoin="bevel">
    <polygon points="103,76 108,84 103,92 98,84" fill="#FEF9C3"/>
    <polygon points="155,83 159,89 155,95 151,89" fill="#FDE047"/>
  </g>

  <!-- Tall teardrop roaring blaze (78x120; dominant central spire clears side licks by 37+ units) -->
  <polygon points="130,67 140,94 145,116 159,104 167,138 157,168 128,187 99,168 89,138 97,108 109,120 115,92" fill="url(#lc-tls-outer)" stroke="#2A1604" stroke-width="3.5" stroke-linejoin="bevel"/>
  <!-- 120° shadow-side facet split -->
  <polygon points="130,67 140,94 145,116 159,104 167,138 157,168 128,187" fill="#D97706" fill-opacity="0.34"/>

  <!-- Recessed obsidian cutout echoing Dedicated's streak family grammar -->
  <polygon points="129,104 147,139 142,165 128,176 114,165 109,139" fill="#1C1104"/>

  <!-- White-hot incandescent inner flame tongue -->
  <polygon points="129,115 141,142 137,161 128,170 119,161 115,142" fill="url(#lc-tls-inner)"/>
  <!-- Diamond flame heart + amethyst prism core -->
  <polygon points="128,136 136,149 128,162 120,149" fill="#FFFFFF"/>
  <polygon points="128,142 132.5,149 128,156 123.5,149" fill="#A78BFA"/>
</svg>
