<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="lc-tded-title">
  <title id="lc-tded-title">Dedicated trophy</title>
  <defs>
    <linearGradient id="lc-tded-left" gradientUnits="userSpaceOnUse" x1="88" y1="70" x2="128" y2="184">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="lc-tded-right" gradientUnits="userSpaceOnUse" x1="128" y1="70" x2="168" y2="184">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
