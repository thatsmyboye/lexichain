<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="lc-tcc-title">
  <title id="lc-tcc-title">Chaos Conductor trophy</title>
  <defs>
    <linearGradient id="lc-tcc-tile" gradientUnits="userSpaceOnUse" x1="-19" y1="-19" x2="19" y2="19">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="lc-tcc-arc" gradientUnits="userSpaceOnUse" x1="94" y1="100" x2="162" y2="156">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- 3 exposed jagged lightning conduits bridging the open channels between tiles -->
  <g fill="none" stroke-linejoin="bevel" stroke-linecap="square">
    <!-- Separation halos -->
    <polyline points="116,104 103,115 112,120 102,135" stroke="#071A33" stroke-width="11"/>
    <polyline points="140,104 153,115 144,120 154,135" stroke="#071A33" stroke-width="11"/>
    <polyline points="112,149 124,143 130,153 144,147" stroke="#071A33" stroke-width="11"/>
    <!-- Electric cyan-white lightning bolts -->
    <polyline points="116,104 103,115 112,120 102,135" stroke="url(#lc-tcc-arc)" stroke-width="5.5"/>
    <polyline points="140,104 153,115 144,120 154,135" stroke="url(#lc-tcc-arc)" stroke-width="5.5"/>
    <polyline points="112,149 124,143 130,153 144,147" stroke="url(#lc-tcc-arc)" stroke-width="5.5"/>
  </g>

  <!-- Tile 1 (Top, 38x38, -10°) -->
  <g transform="translate(128 92) rotate(-10)">
    <rect x="-19" y="-19" width="38" height="38" rx="7" fill="url(#lc-tcc-tile)" stroke="#071A33" stroke-width="3.5"/>
    <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.9"/>
    <polygon points="0,-11.5 3.6,-3.6 11.5,0 3.6,3.6 0,11.5 -3.6,3.6 -11.5,0 -3.6,-3.6" fill="#071A33"/>
  </g>

  <!-- Tile 2 (Bottom-Left, 38x38, +14°) -->
  <g transform="translate(97 146) rotate(14)">
    <rect x="-19" y="-19" width="38" height="38" rx="7" fill="url(#lc-tcc-tile)" stroke="#071A33" stroke-width="3.5"/>
    <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.9"/>
    <path d="M-8.5,-8.5 L8.5,8.5 M8.5,-8.5 L-8.5,8.5" fill="none" stroke="#071A33" stroke-width="5" stroke-linecap="square"/>
  </g>

  <!-- Tile 3 (Bottom-Right, 38x38, -14°) -->
  <g transform="translate(159 146) rotate(-14)">
    <rect x="-19" y="-19" width="38" height="38" rx="7" fill="url(#lc-tcc-tile)" stroke="#071A33" stroke-width="3.5"/>
    <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.9"/>
    <polygon points="0,-11 11,0 0,11 -11,0" fill="#071A33"/>
  </g>

  <!-- Compact central spark hub clear of the perimeter arcs -->
  <polygon points="128,116 132,124 140,128 132,132 128,140 124,132 116,128 124,124" fill="#FFFFFF" stroke="#071A33" stroke-width="2.8" stroke-linejoin="bevel"/>
</svg>
