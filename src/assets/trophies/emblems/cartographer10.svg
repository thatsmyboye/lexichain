<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="lc-tca-title">
  <title id="lc-tca-title">Cartographer trophy</title>
  <defs>
    <linearGradient id="lc-tca-ring" gradientUnits="userSpaceOnUse" x1="87" y1="87" x2="169" y2="169">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Stepped compass degree ring (outer r=41, inner r=31) -->
  <circle cx="128" cy="128" r="36" fill="none" stroke="url(#lc-tca-ring)" stroke-width="10"/>
  <circle cx="128" cy="128" r="41" fill="none" stroke="#071A33" stroke-width="3.5"/>
  <circle cx="128" cy="128" r="31" fill="none" stroke="#071A33" stroke-width="3.5"/>
  <path d="M97 110 A36 36 0 0 1 146 97" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85"/>

  <!-- 4 intercardinal needles (r = 49, alternating light/shadow halves) -->
  <g transform="translate(128 128) rotate(45)" stroke-linejoin="bevel">
    <polygon points="0,-49 0,0 -8,-8" fill="#E0F2FE"/>
    <polygon points="0,-49 8,-8 0,0" fill="#38BDF8"/>
    <polygon points="49,0 0,0 8,-8" fill="#E0F2FE"/>
    <polygon points="49,0 8,8 0,0" fill="#38BDF8"/>
    <polygon points="0,49 0,0 8,8" fill="#E0F2FE"/>
    <polygon points="0,49 -8,8 0,0" fill="#38BDF8"/>
    <polygon points="-49,0 0,0 -8,8" fill="#E0F2FE"/>
    <polygon points="-49,0 -8,-8 0,0" fill="#38BDF8"/>
    <polygon points="0,-49 8,-8 49,0 8,8 0,49 -8,8 -49,0 -8,-8" fill="none" stroke="#071A33" stroke-width="3.2"/>
  </g>

  <!-- 4 dominant cardinal needles (r = 60, crisp nautical alternating split) -->
  <g stroke-linejoin="bevel">
    <!-- North -->
    <polygon points="128,68 128,128 115,115" fill="#FFFFFF"/>
    <polygon points="128,68 141,115 128,128" fill="#38BDF8"/>
    <!-- East -->
    <polygon points="188,128 128,128 141,115" fill="#FFFFFF"/>
    <polygon points="188,128 141,141 128,128" fill="#38BDF8"/>
    <!-- South -->
    <polygon points="128,188 128,128 141,141" fill="#FFFFFF"/>
    <polygon points="128,188 115,141 128,128" fill="#38BDF8"/>
    <!-- West -->
    <polygon points="68,128 128,128 115,141" fill="#FFFFFF"/>
    <polygon points="68,128 115,115 128,128" fill="#38BDF8"/>

    <!-- Clean dark contour & spine lines drawn on top -->
    <polygon points="128,68 141,115 188,128 141,141 128,188 115,141 68,128 115,115" fill="none" stroke="#071A33" stroke-width="3.5"/>
    <line x1="128" y1="73" x2="128" y2="183" stroke="#071A33" stroke-width="2.2"/>
    <line x1="73" y1="128" x2="183" y2="128" stroke="#071A33" stroke-width="2.2"/>
  </g>

  <!-- Center pivot jewel -->
  <polygon points="128,117 139,128 128,139 117,128" fill="#FFFFFF" stroke="#071A33" stroke-width="3" stroke-linejoin="bevel"/>
  <polygon points="128,123 133,128 128,133 123,128" fill="#071A33"/>
</svg>
