<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="lc-tth-title">
  <title id="lc-tth-title">Treasure Hunter trophy</title>
  <defs>
    <linearGradient id="lc-tth-g1" gradientUnits="userSpaceOnUse" x1="-40" y1="-32" x2="40" y2="42">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="48%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="lc-tth-g2" gradientUnits="userSpaceOnUse" x1="-32" y1="-26" x2="32" y2="34">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="46%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#914DEF" />
    </linearGradient>
  </defs>

  <!-- Upper-right prism sparkle -->
  <g transform="translate(162 92)" stroke-linejoin="bevel">
    <polygon points="0,-11 3.4,-3.4 11,0 3.4,3.4 0,11 -3.4,3.4 -11,0 -3.4,-3.4" fill="#FFFFFF" stroke="#14072B" stroke-width="2.8" />
  </g>

  <!-- Primary brilliant-cut gem (tilted -12°, W=80 H=74) -->
  <g transform="translate(111 119) rotate(-12)" stroke-linejoin="bevel">
    <!-- Base fill + faceted 120° plane shading -->
    <polygon points="-24,-32 24,-32 40,-10 0,42 -40,-10" fill="url(#lc-tth-g1)" />
    <polygon points="-24,-32 -13,-10 -40,-10" fill="#FFFFFF" />
    <polygon points="-24,-32 24,-32 13,-10 -13,-10" fill="#F5F3FF" />
    <polygon points="24,-32 40,-10 13,-10" fill="#C4B5FD" />
    <polygon points="-40,-10 -13,-10 0,42" fill="#DDD6FE" />
    <polygon points="-13,-10 13,-10 0,42" fill="#C4B5FD" />
    <polygon points="13,-10 40,-10 0,42" fill="#914DEF" />
    <!-- Internal facet ridges -->
    <g fill="none" stroke="#14072B" stroke-width="2.2" stroke-opacity="0.72">
      <line x1="-40" y1="-10" x2="40" y2="-10" />
      <polyline points="-24,-32 -13,-10 0,42" />
      <polyline points="24,-32 13,-10 0,42" />
    </g>
    <!-- Top-left specular catch -->
    <polyline points="-35,-11 -22,-28 19,-28" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.9" />
    <!-- Clean outer contour on top -->
    <polygon points="-24,-32 24,-32 40,-10 0,42 -40,-10" fill="none" stroke="#14072B" stroke-width="3.5" />
  </g>

  <!-- Companion cut gem (tilted +14°, W=64 H=60) -->
  <g transform="translate(150 146) rotate(14)" stroke-linejoin="bevel">
    <polygon points="-19,-26 19,-26 32,-8 0,34 -32,-8" fill="url(#lc-tth-g2)" />
    <polygon points="-19,-26 -10,-8 -32,-8" fill="#FFFFFF" />
    <polygon points="-19,-26 19,-26 10,-8 -10,-8" fill="#EDE9FE" />
    <polygon points="19,-26 32,-8 10,-8" fill="#B197FC" />
    <polygon points="-32,-8 -10,-8 0,34" fill="#C4B5FD" />
    <polygon points="-10,-8 10,-8 0,34" fill="#A78BFA" />
    <polygon points="10,-8 32,-8 0,34" fill="#7C3AED" />
    <g fill="none" stroke="#14072B" stroke-width="2.2" stroke-opacity="0.72">
      <line x1="-32" y1="-8" x2="32" y2="-8" />
      <polyline points="-19,-26 -10,-8 0,34" />
      <polyline points="19,-26 10,-8 0,34" />
    </g>
    <polyline points="-27,-9 -17,-22 14,-22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.9" />
    <polygon points="-19,-26 19,-26 32,-8 0,34 -32,-8" fill="none" stroke="#14072B" stroke-width="3.5" />
  </g>
</svg>
