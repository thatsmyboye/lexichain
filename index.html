    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lexichain – Word Chain Puzzle</title>
    <meta name="description" content="Chain letters into words, link each word to the last — how long can your chain grow?" />
    <meta name="theme-color" content="#7927EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />

    <!-- Critical CSS inlined to prevent render blocking -->
    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --primary: 222.2 47.4% 11.2%;
        --primary-foreground: 210 40% 98%;
        --brand-500: 265 84% 54%;
        --border: 214.3 31.8% 91.4%;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: 222.2 84% 4.9%;
          --foreground: 210 40% 98%;
          --primary: 210 40% 98%;
          --primary-foreground: 222.2 47.4% 11.2%;
          --brand-500: 265 84% 66%;
          --border: 217.2 32.6% 17.5%;
        }
      }
      * { border-color: hsl(var(--border)); }
      body { 
        background-color: hsl(var(--background)); 
        color: hsl(var(--foreground)); 
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root { min-height: 100dvh; }
    </style>

    <!-- Preload the display font so tile letters rarely swap after first paint -->
    <link rel="preload" href="/fonts/sora-display.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preload main CSS for faster loading -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Lexichain" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
