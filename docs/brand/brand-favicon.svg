<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="lc-fv-title">
  <title id="lc-fv-title">Lexichain</title>
  <defs>
    <linearGradient id="lc-fv-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B583FF" />
      <stop offset="100%" stop-color="#7A2FE8" />
    </linearGradient>
    <linearGradient id="lc-fv-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE48A" />
      <stop offset="100%" stop-color="#F7B92B" />
