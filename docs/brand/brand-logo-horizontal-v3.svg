<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 96" width="680" height="96" role="img" aria-labelledby="lc-h-title">
  <title id="lc-h-title">Lexichain</title>
  <defs>
    <linearGradient id="lc-h-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#914DEF" />
      <stop offset="52%" stop-color="#7927EC" />
      <stop offset="100%" stop-color="#6713DD" />
    </linearGradient>
    <linearGradient id="lc-h-link" gradientUnits="userSpaceOnUse" x1="0" y1="-8" x2="0" y2="8">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="55%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <g id="lc-h-tile">
      <rect x="0" y="8" width="56" height="56" rx="8" fill="#0F172A" fill-opacity="0.22" />
      <rect x="0" y="5" width="56" height="56" rx="8" fill="#3B0764" />
      <rect x="0" y="0" width="56" height="56" rx="8" fill="url(#lc-h-face)" stroke="#4C1D95" stroke-width="1.25" />
      <path d="M8 1.5 H48" stroke="#DDD6FE" stroke-width="1.5" stroke-opacity="0.8" />
    </g>

    <g id="lc-h-chain">
      <path fill-rule="evenodd" d="M-16 -3.5 L-13 -6.5 H2 L5 -3.5 V6.5 L2 9.5 H-13 L-16 6.5 Z M-12 -1.5 L-10.5 -3 H-0.5 L1 -1.5 V4.5 L-0.5 6 H-10.5 L-12 4.5 Z" fill="#0F172A" fill-opacity="0.24" />
      <path fill-rule="evenodd" d="M-5 -3.5 L-2 -6.5 H13 L16 -3.5 V6.5 L13 9.5 H-2 L-5 6.5 Z M-1 -1.5 L0.5 -3 H10.5 L12 -1.5 V4.5 L10.5 6 H0.5 L-1 4.5 Z" fill="#0F172A" fill-opacity="0.24" />
      <path fill-rule="evenodd" d="M-16 -5 L-13 -8 H2 L5 -5 V5 L2 8 H-13 L-16 5 Z M-12 -2.5 L-10.5 -4 H-0.5 L1 -2.5 V2.5 L-0.5 4 H-10.5 L-12 2.5 Z" fill="url(#lc-h-link)" stroke="#2E1065" stroke-width="1.5" stroke-linejoin="bevel" />
      <path fill-rule="evenodd" d="M-5 -5 L-2 -8 H13 L16 -5 V5 L13 8 H-2 L-5 5 Z M-1 -2.5 L0.5 -4 H10.5 L12 -2.5 V2.5 L10.5 4 H0.5 L-1 2.5 Z" fill="url(#lc-h-link)" stroke="#2E1065" stroke-width="1.5" stroke-linejoin="bevel" />
      <path d="M-7 -8 H1 V-4 H-7 Z" fill="url(#lc-h-link)" />
      <path d="M-7 -8 H1 M-7 -4 H1" fill="none" stroke="#2E1065" stroke-width="1.5" />
      <path d="M1 1.5 H5 V5 L2 8 H-1 V4 H1 Z" fill="url(#lc-h-link)" />
      <path d="M1 1.5 V4 H-1 M5 1.5 V5 L2 8 H-1" fill="none" stroke="#2E1065" stroke-width="1.5" stroke-linejoin="bevel" />
    </g>
  </defs>

