    <path d="M16.1 15 H21.7 V25.3 H34.3 V15 H39.9 V41 H34.3 V30.3 H21.7 V41 H16.1 Z" fill="#FFFFFF" />
  </g>
  <g transform="translate(460 17)">
    <use href="#lc-h-tile" />
    <path fill-rule="evenodd" d="M24.5 15 H31.5 L41.75 41 H35.95 L33.8 35.6 H22.2 L20.05 41 H14.25 Z M28 20.8 L24.1 30.8 H31.9 Z" fill="#FFFFFF" />
  </g>
  <g transform="translate(534 17)">
    <use href="#lc-h-tile" />
    <path d="M21.8 15 H34.2 V19.4 H30.8 V36.6 H34.2 V41 H21.8 V36.6 H25.2 V19.4 H21.8 Z" fill="#FFFFFF" />
