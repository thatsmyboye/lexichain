    <path d="M38.5 22.6 C37.6 18.8 33.8 17.3 28.6 17.3 C21.2 17.3 17.5 21.4 17.5 28.0 C17.5 34.6 21.2 38.7 28.6 38.7 C33.8 38.7 37.6 37.2 38.5 33.4" fill="none" stroke="#FFFFFF" stroke-width="5.4" stroke-linecap="butt" />
  </g>
  <g transform="translate(386 17)">
